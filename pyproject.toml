[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brainmaze-torch"
version = "0.2.0"
description = "BrainMaze: Brain Electrophysiology, Behavior and Dynamics Analysis Toolbox - Torch"
authors = [
    { name = "Filip Mivalt", email = "mivalt.filip@mayo.edu" }
]
readme = { file = "README.rst", content-type = "text/x-rst" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.3",           # torch < 2.3 cannot use numpy 2 (torch.from_numpy fails)
]
license = { text = "BSD-3-Clause" }
classifiers = [
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: BSD License",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
]
urls = { "Homepage" = "https://github.com/bnelair/brainmaze-torch" }

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["."]
# Only ship the package itself (docs_src/, tests/, img/ must never end up in the wheel).
include = ["brainmaze_torch", "brainmaze_torch.*"]
exclude = ["brainmaze_torch.tests", "brainmaze_torch.tests.*"]

[tool.setuptools.package-data]
# The trained seizure-detection models are required at runtime and ship in the wheel and
# the sdist. They are the ONLY non-Python files in the release.
"brainmaze_torch" = ["seizure_detection/_models/*.pt"]

[tool.setuptools]
# Only the package-data listed above; the sdist is trimmed by MANIFEST.in.
include-package-data = false
