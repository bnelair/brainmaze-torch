[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brainmaze-torch"
version = "0.3.0"
description = "DEPRECATED (final release): compatibility shim re-exporting brainmaze-eeg-models; use brainmaze-eeg-models instead"
authors = [
    { name = "Filip Mivalt", email = "mivalt.filip@mayo.edu" }
]
readme = { file = "README.rst", content-type = "text/x-rst" }
requires-python = ">=3.10"
# Final release (0.3.0): a shim over the successor package. No PyTorch any more.
dependencies = [
    "brainmaze-eeg-models>=0.1.0",
]
license = { text = "BSD-3-Clause" }
classifiers = [
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Development Status :: 7 - Inactive",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: BSD License",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
]
urls = { "Homepage" = "https://github.com/bnelair/brainmaze-torch", "Successor" = "https://github.com/bnelair/brainmaze-eeg-models", "Migration" = "https://bnelair.github.io/brainmaze-eeg-models/seizure.html#moving-from-brainmaze-torch" }

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["."]
# Only ship the package itself (docs_src/, tests/, img/ must never end up in the wheel).
include = ["brainmaze_torch", "brainmaze_torch.*"]
exclude = ["brainmaze_torch.tests", "brainmaze_torch.tests.*"]

[tool.setuptools]
# Python code only: the trained models (formerly _models/*.pt) now ship, as ONNX, with
# brainmaze-eeg-models. The sdist is trimmed by MANIFEST.in; CI checks both artifacts.
include-package-data = false
