name: Release

# Runs on every push to main but only releases when the current pyproject version has no
# tag yet -- i.e. right after a "Release vX.Y.Z" bump PR is merged. Ordinary dev -> main
# feature merges leave the version unchanged and no-op.
#
# The shared reusable workflow does guard + test + build (and uploads the `dist` artifact).
# Publishing to PyPI happens HERE, in this repo's own top-level job, using the org-level API
# token secret PYPI_Token_General (maintainer decision; brainmaze-eeg/-utils use Trusted
# Publishing instead -- switching is optional, see RELEASING.md). The tag and GitHub Release
# are created only after a successful PyPI upload. If the publish fails, nothing is tagged;
# see RELEASING.md for recovery (a later push to main would release THAT commit instead).

on:
  push:
    branches: [main]

permissions:
  contents: read           # least privilege for the reusable build job; publish raises its own

jobs:
  build:
    uses: bnelair/brainmaze-sphinx/.github/workflows/release.yml@main

  publish:
    needs: build
    if: needs.build.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write      # push the tag + create the GitHub Release
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Check PyPI token is available
        env:
          TOKEN: ${{ secrets.PYPI_Token_General }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret PYPI_Token_General is not available to this repository (org secret missing or not shared with brainmaze-torch). Nothing was published or tagged."
            exit 1
          fi

      - name: Publish to PyPI (org API token)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_Token_General }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag and create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}   # via env, never inlined into the script
        run: |
          set -euo pipefail
          v="v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$v"
          git push origin "$v"                 # tag ref -- not covered by the branch ruleset
          gh release create "$v" --title "$v" --generate-notes
