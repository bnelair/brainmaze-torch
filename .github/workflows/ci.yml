name: CI

on: [push, pull_request]

# Tests only read the repository.
permissions:
  contents: read

jobs:
  test:
    uses: bnelair/brainmaze-sphinx/.github/workflows/test.yml@main
    with:
      package-import-name: brainmaze_torch
      # Fail if the wheel/sdist contain anything but the package (no tests, demos, docs,
      # data); see brainmaze-sphinx check-dist.yml. Since 0.3.0 (the final release, a shim
      # over brainmaze-eeg-models) the package is Python code only: no required or allowed
      # assets (the trained models ship, as ONNX, with brainmaze-eeg-models). Keep this in
      # sync with release.yml.
      dist-check: error
