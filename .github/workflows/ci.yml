name: CI

on: [push, pull_request]

# Tests only read the repository.
permissions:
  contents: read

jobs:
  test:
    uses: bnelair/brainmaze-sphinx/.github/workflows/test.yml@main
    with:
      package-import-name: brainmaze_torch
      # Fail if the wheel/sdist contain anything but the package (no tests, demos, docs,
      # data); see brainmaze-sphinx check-dist.yml.
      dist-check: error
      # The trained models are required at runtime: the check fails if either is missing
      # from the wheel or the sdist. Keep this list in sync with release.yml.
      required-assets: >-
        brainmaze_torch/seizure_detection/_models/modelA_paper.pt
        brainmaze_torch/seizure_detection/_models/modelB_full.pt
      # Any other model file directly in _models/ ('*' does not cross '/').
      allowed-assets: brainmaze_torch/seizure_detection/_models/*.pt
